
name: Flask Image Recognition CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install Flask==2.2.5 Werkzeug==2.2.3
          pip install pylint pytest pre-commit

      - name: Check code quality with Pylint
        run: |
          python -m pylint app.py model.py --score=y

      - name: Run pre-commit checks
        run: |
          python -m pre_commit run --all-files

      - name: Run all pytest tests
        run: |
          python -m pytest -q
