
name: Flask Image Recognition CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python 3.10
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: Flask==2.2.5 Werkzeug==2.2.3
          python -m pip install --only-binary=:all: pylint pytest pre-commit

      - name: Check code quality with Pylint
        run: |
          python -m pylint app.py model.py --score=y

      - name: Run pre-commit checks
        run: |
          python -m pre_commit run --all-files

      - name: Run all pytest tests
        env:
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}
        run: |
          python -m pytest -q
